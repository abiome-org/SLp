selection: >-
  Submitted filtered matrices and exact two-guide assignments only. Basal pools
  the two author-declared complete controls CTRL0002+CTRL0001 and
  hRosa26_2+CTRL0001. A single Puro target must pair with Blasti CTRL0001;
  same-vector target+CTRL0002 calls are rejected. Doubles require two distinct
  target genes. Every retained population requires at least ten cells.
normalization: per-cell total-count CP10K, log1p, then population mean
leakageRouting: >-
  CBFB, NF2, SMAD4 and every combination containing one of them are removed
  before aggregation because they occur in the pinned 1,492-gene validation roster.
