    source: https://pmc.ncbi.nlm.nih.gov/articles/PMC7615649/
  sampleRoles:
    ko: individual-perturbation-outcome
    HIS3: biological-WT-control
    qc: analytical-QC-only-excluded-from-world-records
  inputValue:
    quantity: upstream batch-corrected MaxLFQ relative intensity
    required: finite and strictly positive when observed
    missingToken: NA
  outputValue:
    transform: log2 of each observed input intensity with no pseudocount
    valueSpace: slp-value:log2-batch-corrected-maxlfq-relative-intensity
    likelihood: gaussian
    missing: unobserved; preserve as missing and never impute or convert to zero
    additionalCentering: none
  basalProfile:
    aggregation: arithmetic mean of observed log2 values over the 388 documented HIS3-complemented biological WT controls, independently per readout
    minimumObservedFraction: 0.8
    fittingDataUsed: biological WT controls only; no knockout outcome contributes
  technicalCovariates:
    plate: audit-only because the upstream payload is already plate corrected; never a biological context or learnable world feature
    filenameSuffixes: untrusted-provenance-only
  interventionPolicy: include only rows with exact current one-to-one systematic-name mapping; preserve duplicate rows as replicates; quarantine every other row before held-roster intersection
  readoutPolicy: use UniProtKB CURIE identity for all 1850 proteins and preserve typed one-to-many gene relations
  prohibited:
    - published centering across all knockout and WT samples
    - imputed matrix or differential-statistics files
    - growth-rate or filename-derived targets and features
    - pooled-digest QC profiles as basal biological states
