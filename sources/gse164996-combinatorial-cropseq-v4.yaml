selection: >-
  Submitted filtered matrices and exact two-guide assignments only. Basal pools
  the two complete author controls CTRL0002+CTRL0001 and
  hRosa26_2+CTRL0001; singleton CTRL0001 controls imputed by the author code
  are excluded. Following the author rules, an exact target plus either
  numbered control is an SKO and two distinct non-control target guides are a
  DKO. Same-gene pairs and hRosa26+target pairs are excluded. The deposited
  feature_call field does not expose Puro/Blasti vector slots, so no unsupported
  slot assignment is invented. Every population view requires at least ten cells.
normalization: per-cell total-count CP10K, log1p, then population mean
leakageRouting: >-
  CBFB, NF2, SMAD4 and every combination containing one of them are removed
  before aggregation because they occur in the pinned 1,492-gene validation roster.
