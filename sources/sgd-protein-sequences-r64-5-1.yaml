limitations:
  - >-
    The pinned README's companion-file prose says orf_trans.fasta.gz excludes
    pseudogenes, but the exact companion content includes at least YAR061W.
    The all-sequence payload is governed by its exact bytes and asserted record
    composition, not by that inconsistent subset prose.
  - >-
    Static sequence access means held genes are unseen only with respect to
    quantitative intervention outcomes, not unseen biological entities.
  - >-
    This snapshot provides protein sequences only. It provides no domain,
    annotation, orthology, phylogeny, quantitative outcome, or benchmark data.
