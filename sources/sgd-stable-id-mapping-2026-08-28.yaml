normalizationContract:
  outputSchema: slp.sgd-stable-id-mapping/v1
  releaseIdentityField: identityMappingId
  releaseDigestField: identityMappingSha256
  canonicalGeneRecord:
    source: SGD_features.tab
    identityField: canonicalSgdCurie
    primaryIdColumn: 1
    curieRule: "prepend SGD: to the exact primary SGDID"
    allowedFeatureType: ORF
    systematicNameColumn: 4
    standardGeneNameColumn: 5
    freeTextAliasColumn: 6
    secondarySgdIdColumn: 8
  systematicOrfResolution:
    key: exact SGD_features.tab column 4 value
    target: canonical SGD CURIE from column 1 on the same current ORF row
    caseNormalization: none
    onDuplicateOrMissingTarget: quarantine
  externalAccessionResolution:
    source: dbxref.tab
    keyColumns:
      accession: 1
      accessionSource: 2
      accessionType: 3
    featureNameColumn: 4
    primarySgdIdColumn: 5
    typedKeyRequired: true
    bareAccessionAccepted: false
    caseNormalization: none
    namespaceInferenceFromLexicalShape: forbidden
    normalizationPreservesAllTypedRelations: true
    targetMustExistAsCurrentPrimaryOrf: false
    emittedTargetStatus:
      - current-orf
      - current-non-orf
      - retired-or-merged
      - not-in-current-feature-table
    onMultipleCurrentTargets: emit-all-exact-relations
    onMissingCurrentTarget: preserve-relation-with-target-status
    collapseOrDiscardRelations: forbidden
  downstreamUntypedAccessionPolicy:
    exampleField: Mendeley w8jtmnszd9.2 Protein.Group
    assumeUniProtFromSixCharacterShape: false
    requirement: >-
      A downstream query must declare an explicit typed relation filter and
      admissibility policy. Lexical shape alone never supplies a namespace.
  downstreamQueryPolicies:
    proteomeUniProt:
      consumer: Mendeley w8jtmnszd9.2
      inputField: Protein.Group
      preserveInputAccessionKey: true
      typedRelationFilter:
        accessionSources:
          - EBI
          - UniProtKB
        accessionType: UniProtKB ID
      eligibleTargetStatus: current-orf
      preserveAllExactCurrentOrfRelations: true
      onMultipleCurrentOrfRelations: retain-all-and-defer-query-specific-admissibility
      onNoCurrentOrfRelation: quarantine-downstream-record
      chooseFirst: false
      note: >-
        The proteome adapter keeps the exact UniProt accession key together
        with every exact current-ORF relation. Any later one-gene requirement
        is a downstream query policy, never normalization-time data loss.
  displayMetadata:
    standardGeneName: SGD_features.tab column 5
    aliases: SGD_features.tab column 6
    resolutionUse: forbidden
  retiredIdentityPolicy:
    source: deleted_merged_features.tab
    deletedAndMergedIdsAreCanonicalInputs: false
    automaticRedirectToNewPrimaryId: false
    action: quarantine-with-source-row-and-date
  globalAmbiguityPolicy:
    action: quarantine
    neverChooseFirst: true
    neverResolveByDisplaySymbol: true
