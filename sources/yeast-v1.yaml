schema: slp.source-plan/v1
species:
  name: Saccharomyces cerevisiae
  ncbiTaxon: 4932
identity:
  primaryNamespace: SGD
  symbolUse: display-only
sources:
  - id: sgd-stable-id-mapping-2026-08-28
    role: identity-provenance
    status: raw-snapshot-admitted-normalized-map-produced
    manifest: sources/sgd-stable-id-mapping-2026-08-28.yaml
    rights: rights/sgd-stable-id-mapping-cc-by-4.0.yaml
    modalities:
      - stable-gene-identity
      - typed-external-accession-relation
      - retired-identity-quarantine
    admissionRule: normalize the exact object-version and SHA-256-pinned tables, retain ambiguity, and admit current mappings plus quarantine with complete lineage
  - id: sgd-reference
    role: static-features
    status: admitted-for-preparation
    rights: rights/sgd-cc-by-4.0.yaml
    modalities:
      - reference-sequence
      - gene-annotation
      - phenotype-annotation
      - regulation-annotation
    releaseRule: pin the SGD or Alliance release and checksum every downloaded file
  - id: biogrid-yeast
    role: molecular-pretraining
    status: admitted-for-preparation
    rights: rights/biogrid-mit.yaml
    modalities:
      - physical-interaction
      - genetic-interaction-annotation
    releaseRule: use an immutable BioGRID release, never a LATEST alias in an OMF snapshot
  - id: costanzo-2016-sga
    role: molecular-pretraining-and-reward
    status: rights-quarantine
    rights: rights/costanzo-2016-sga.yaml
    modalities:
      - single-mutant-fitness
      - double-mutant-fitness
      - quantitative-genetic-interaction
    scale:
      doubleMutantsApproximate: 23000000
      negativeInteractionsApproximate: 550000
      positiveInteractionsApproximate: 350000
    admissionRule: verify explicit training and redistribution terms for the downloadable matrix bytes
    modelingRule: preserve allele, temperature, array type, direction, replicate uncertainty, and yeast identity
  - id: zenodo-14062629-yeast-transcriptome
    role: molecular-pretraining-validation-and-final
    status: contract-blocked
    manifest: sources/yeast-single-cell-atlas-v1.yaml
    rights: rights/zenodo-14062629-cc-by-4.0.yaml
    modalities:
      - single-cell-transcriptome
    admissionRule: complete the typed sparse v1.1 contract and a no-training schema probe before acquiring the allowlisted payload
  - id: mendeley-w8jtmnszd9-v2-yeast-proteome
    role: molecular-pretraining-validation-and-final
    status: contract-blocked
    manifest: sources/yeast-proteome-v2.yaml
    rights: rights/mendeley-w8jtmnszd9-v2-cc-by-4.0.yaml
    modalities:
      - quantitative-proteome
    admissionRule: complete the typed sparse v1.1 contract and a no-training schema probe before acquiring the allowlisted payloads
  - id: spell-expression
    role: molecular-pretraining
    status: per-dataset-rights-review
    modalities:
      - transcriptome
    admissionRule: each underlying study is a separate OMF snapshot with its own accession and rights
splits:
  unit: intervention-gene
  rule: molecular-validation genes are absent from all quantitative pretraining and reward trajectories
  staticFeatureOverlapAllowed: true
transfer:
  rule: align yeast and human through sequence, annotation, phylogeny, and versioned orthology relations
  forbidden: do not replace yeast identifiers or outcomes with human symbols or labels
