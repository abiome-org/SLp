trainingReproductionGaps:
  - The public main.py exposes checkpoint inference and baselines but no training entry point.
  - >-
    PertPredictor defaults to AdamW learning rate 0.001 and zero weight decay,
    but the released inference configs do not establish the tuned training
    schedule, epoch count, or stopping rule.
  - >-
    The paper states perturbation-group target ratios 0.5625/0.1875/0.25 for
    train/validation/test, while data/preprocessing_utils.py defaults yield
    0.65/0.10/0.25; neither should replace the fixed local split.
  - >-
    The released implementation uses symbol-indexed learned perturbation ID
    embeddings and pickle split files, which do not satisfy the SLp stable-ID,
    ID-vocabulary-free, or no-pickle contracts without adaptation.
