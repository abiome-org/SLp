limitations:
  - These compact files are pseudobulk summaries, not independent single-cell observations.
  - K562 and RPE1 differ in sampling day and screened action population as well as cellular context.
  - The five RPE1 rows without terminal Ensembl IDs must remain quarantined unless a pinned source-native mapping resolves them.
  - Gene symbols are annotations only and must never replace taxon-9606 Ensembl identities.
  - This acquisition is not an OMF admission, split, training run, validation result, or transfer claim.
nextIngestionTask: >-
  Implement a bounded metadata-first AnnData adapter that verifies each SHA-256,
  preserves (9606, Ensembl gene ID) keys and original obs row IDs, quarantines
  unresolved actions, separates non-targeting controls, audits X sparsity and
  count semantics, then constructs source/context-stratified fitting-only
  pseudobulks without using held-gene or benchmark outcomes.
