selection: >-
  Submitted filtered matrices and axes plus submitted per-cell protospacer calls
  only. A usable cell must have exactly the two distinct guides expected from
  the dual-vector experiment. Singles require one target plus CTRL0001/2;
  basal controls require CTRL0001+CTRL0002; doubles require two distinct target
  genes. Each population view requires at least ten aligned cells.
normalization: per-cell total-count CP10K, log1p, then population mean
leakageRouting: >-
  Any call containing a gene in the 1,492-gene validation roster from the
  pinned four-context snapshot is removed before outcome aggregation. This
  excludes CBFB, NF2, and SMAD4 and all combinations containing them.
protectedTestOpened: false
limitations:
  - Guide-level populations are retained separately when several guides target one stable gene.
  - The 7,000-gene query axis is the exact overlap with the existing 7,036-gene world-model panel.
  - Population means do not retain cell-level heterogeneity.
  - Public research training rights do not imply unconditional redistribution rights.
