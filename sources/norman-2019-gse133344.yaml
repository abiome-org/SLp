limitations:
  - The source does not deposit the author's normalized population-mean CSV; this adapter derives a transparent pseudobulk from official raw filtered UMI data.
  - Only 42 of 105 Norman action genes are currently present in the 7,542-entity human static-feature universe; combination modeling needs a pinned feature extension for the other 63.
  - The test-only file was routed mechanically and no test outcome metrics or numeric summaries were computed.
  - This is public molecular-response data, not a synthetic-lethality benchmark or an OMF admission.
