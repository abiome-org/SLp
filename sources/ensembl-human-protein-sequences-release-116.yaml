identity:
  entityNamespace: Ensembl-gene
  entityPattern: ^ENSG[0-9]+$
  fastaGeneField: exact gene:ENSG[0-9]+.<version> header token
  mappingRule: remove the Ensembl source version suffix, then join the exact stable ENSG ID
  displaySymbolsUsedForIdentity: false
  longestPeptideRule: >-
    For each stable ENSG gene, select the greatest peptide length. Break an
    equal-length tie by ascending stable ENST transcript ID and then ascending
    stable ENSP protein ID. Versioned source IDs remain in provenance.
sequenceNormalization:
  selectionLengthBasis: source peptide character count
  supportedEsmAlphabet: ACDEFGHIKLMNPQRSTVWYXBUZO.-
  internalStopPolicy: map every source '*' residue to ESM unknown residue X and record counts
  terminalStopStripping: false
featurePolicy:
  staticFeatureSourceAllowed: true
  includeHeldEntitySequences: true
  quantitativeOutcomesAllowed: false
  benchmarkLabelsAllowed: false
  symbolsOrDescriptionsAsFeatures: false
  identifierDerivedNumericFeatures: false
validation:
  requireExactAllowlistedFiles: true
  requireUpstreamBsdChecksum: true
  requireLocalSha256: true
  requireGzipIntegrity: true
  requireExactHeaderIdentityFields: true
  preserveMissingEntityRows: true
limitations:
  - This is a downloaded exploratory source, not an admitted OMF DatasetSnapshot.
  - pep.all contains all translations, including isoforms and alternate-locus annotations; the frozen longest-peptide rule is a deterministic representation choice.
  - Ensembl warns that parts of its distribution may carry third-party constraints; this use is limited to the Ensembl-produced GRCh38 protein translation file named above.
  - Static protein availability does not imply that a gene was observed or perturbed in either human context.
