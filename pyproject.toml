[project]
name = "slpbench"
version = "0.1.0"
description = "Real-data, held-out synthetic-lethality benchmark (human ancestry + multi-species)"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pyreadr>=0.5.6",
    "pyyaml>=6.0.3",
    "rdata>=1.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "xlrd>=2.0.2",
]

[project.scripts]
slpbench = "slpbench.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
