scope: >-
  Only held-intervention-roster.tsv and coverage.json emitted by OMF run
  01a06d0b-bd40-7663-a7a3-b1dfb1c1ebbd from the exact admitted identity
  inventories listed below. The derived files contain stable SGD CURIEs,
  deterministic pretrain/validation/final role assignments, source-coverage
  evidence, taxonomy, and provenance; they contain no quantitative molecular
  outcome, target, phenotype, transcriptomic value, proteomic value, or
  synthetic-lethality label.
