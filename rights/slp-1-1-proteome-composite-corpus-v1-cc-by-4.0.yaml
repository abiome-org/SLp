rightsBasis: >-
  The quantitative Mendeley proteome pretraining snapshot, the SGD-derived
  static sequence-feature snapshot, and the outcome-blind held-roster snapshot
  are exact CC BY 4.0 adaptations with redistribution and training allowed
  with attribution. Composite-key joining, deterministic serialization, and
  exclusion checking are further adaptations that do not expand those parent
  scopes or authorize protected outcomes, reward data, or benchmark material.
attribution: >-
  Messner, Christoph; Kustatscher, Georg; Ralser, Markus (2023), The
  Proteomic Landscape of Genome-Wide Genetic Perturbations, Mendeley Data V2,
  https://doi.org/10.17632/w8jtmnszd9.2; Saccharomyces Genome Database (SGD),
  Stanford University, with Engel SR et al. (2025), GENETICS 229(3), iyae185,
  https://doi.org/10.1093/genetics/iyae185; and Nadal-Ribelles, Mariona et al.,
  A single-cell resolved genotype-phenotype map using genome-wide genetic and
  environmental perturbations, Zenodo,
  https://doi.org/10.5281/zenodo.14062629, used only through the outcome-blind
  held-intervention roster provenance.
purposeRestrictions:
  worldModelPretrainingFitting: true
  molecularValidation: false
  molecularReward: false
  molecularFinalHoldout: false
  worldModelArchitectureSelection: false
  calibration: false
  syntheticLethalityLabels: false
  benchmarkDevelopment: false
exclusions:
  - every molecular-validation and molecular-final quantitative outcome; the outcome-blind roster was consumed only to exclude protected interventions
  - held-intervention roster files and role assignments as model inputs or targets
  - basal-control, quarantine, analytical-QC, reward, and synthetic-lethality records
  - benchmark labels, benchmark-derived thresholds, calibration, checkpoint selection, and architecture selection
  - static features other than the exact admitted 21-dimensional sequence-statistics block
  - human outcome relabeling, cross-taxon identity merging, and learned gene-identity features
  - model checkpoints, predictions, evaluation results, and performance claims
  - any future parent DatasetSnapshot, artifact, module, workload, run, or output revision
