  yeast proteome corpus containing 3,811 intervention records, 6,865,493
  observed molecular target values, 3,679 composite-keyed trajectory
  interventions, 1,850 readout queries, 7,037 static-feature rows, and one
  non-gene context entity. It contains no protected quantitative outcome,
  reward record, synthetic-lethality label, or benchmark record.
