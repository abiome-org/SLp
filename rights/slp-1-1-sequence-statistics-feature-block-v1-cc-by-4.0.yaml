scope: >-
  Only sequence-feature-block.tar and sequence-feature-block-audit.json emitted
  by OMF run 01a06df0-2427-7737-9321-1615583dedd8 and reproduced byte for
  byte by run 01a06df0-6255-7e42-bf6d-e87425e8a19c from the exact immutable
  DatasetSnapshots and artifact inputs listed below. The archive contains one
  21-dimensional static descriptor for each of 7,037 taxon-4932 entities:
  peptide length divided by 4096 followed by fractions of the 20 canonical
  amino acids in fixed order. It also contains presence masks, stable identity
  provenance, and excluded non-current SGD sequence provenance. It contains no
  quantitative molecular outcome, held-role assignment, reward, benchmark
  label, learned embedding, checkpoint, or prediction.
