rightsBasis: >-
  The static entity universe and SGD protein-sequence snapshot are CC BY 4.0
  adaptations with redistribution and training allowed with attribution. The
  exact current-ORF set and SGD identity-mapping artifact inputs carry the same
  SGD attribution boundary. Deterministic length and residue-frequency
  calculation is a further static adaptation that does not expand the parent
  scopes or authorize any excluded quantitative or benchmark material.
