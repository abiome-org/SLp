  translations in the exact release file above; it does not extend to linked
  databases, source evidence, or other files in the distribution.
attribution: >-
  Ensembl release 116, Homo sapiens GRCh38 protein translations, EMBL-EBI.
purposeRestrictions:
  staticFeatureGeneration: true
  molecularOutcomeTrainingCorpus: false
  syntheticLethalityLabels: false
exclusions:
  - linked third-party databases and annotations
