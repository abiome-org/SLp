license: mixed-CC-BY-4.0-and-Ensembl-data-no-restrictions
trainingAllowed: true
redistributionAllowed: true
attributionRequired: true
sources:
  - https://release.geneontology.org/2022-09-19/annotations/goa_human.gaf.gz
  - https://ftp.ensembl.org/pub/release-108/tsv/homo_sapiens/Homo_sapiens.GRCh38.108.uniprot.tsv.gz
licenseEvidence:
  geneOntology: https://creativecommons.org/licenses/by/4.0/
  ensembl: https://www.ensembl.org/info/about/legal/disclaimer.html
scope: >-
  Static biological-process annotations in the exact GO Consortium 2022-09-19
  GOA human GAF and exact UniProt-to-Ensembl mapping in Ensembl release 108.
attribution: >-
  Gene Ontology Consortium, GOA human release 2022-09-19; Ensembl release 108,
  Homo sapiens GRCh38 UniProt stable-ID mapping, EMBL-EBI.
purposeRestrictions:
  staticFeatureGeneration: true
  expressionOutcomeTraining: false
  syntheticLethalityLabels: false
exclusions:
  - negated annotations
  - perturbation-derived evidence IMP, IGI, IEP, HMP, HGI, and HEP
  - annotations dated after 2022-12-31
  - gene symbols and free-text descriptions as identity or numerical features
  - linked third-party data outside the two exact files
omfAdmissionClaimed: false
