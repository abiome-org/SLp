scope: >-
  Exactly one file named observation-corpus.tar emitted as
  proteomeMolecularValidationObservation by OMF run
  01a06d60-6e5c-7552-b9ce-01cf6d046c31 from the exact resources listed below.
  The archive contains 537 protected molecular-validation Saccharomyces
  cerevisiae knockout observations over 529 stable SGD intervention identities
  and 1,850 typed UniProtKB readouts, with 967,019 observed positive-intensity
  values transformed by log2 without a pseudocount and 26,431 missing values
  represented only by absent sparse entries. It contains no pretraining,
  molecular-final, quarantine, analytical-QC, control, reward, or
  synthetic-lethality record.
