scope: >-
  Exactly one file named observation-corpus.tar emitted as
  proteomeObservationCorpus by OMF run 01a06d42-8493-7cd5-8c57-779dc8512436
  from the exact resources listed below. The archive contains 3,811
  fitting-only Saccharomyces cerevisiae knockout observations over 3,679
  stable SGD intervention identities and 1,850 typed UniProtKB readouts, with
  6,865,493 observed positive-intensity values transformed by log2 without a
  pseudocount. It contains no molecular-validation, molecular-final,
  quarantine, analytical-QC, reward, or synthetic-lethality record.
