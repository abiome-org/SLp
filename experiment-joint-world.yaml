name: slp-1-1-joint-world-omf2
objective: Train and reproduce the shared intervention-conditioned population world model on physically separated training and adaptive development data.
modelCard: MODEL_CARD.md
data:
  training:
    source: data/derived/slp11-joint-world-expanded-omf-fold0-v1
    rights: {license: "source-specific research mixture; see source rights and captured manifests", trainingAllowed: true}
  development:
    source: data/derived/slp11-joint-world-expanded-development-string-v1
    rights: {license: "source-specific research mixture; see source rights and captured manifests", trainingAllowed: true}
  reference:
    source: results/slp11-transition/human-essential-count-response-rank32-seed731-v1
    rights: {license: project-derived-research-artifact, trainingAllowed: false}
train:
  source: modules/slp-1-1-joint-world-v1
  inputs: [training]
  dependencies: requirements-linux.lock
  command: [python3, train.py, --data, "{inputs[training]}", --output, "{output}/model", --steps, "{parameters[steps]}", --save-every, "{parameters[save_every]}", --seed, "{parameters[seed]}", --norman-fold, "{parameters[norman_fold]}", --width, "{parameters[width]}", --batch-size, "{parameters[batch_size]}", --observation-queries, "{parameters[observation_queries]}", --decode-queries, "{parameters[decode_queries]}", --learning-rate, "{parameters[learning_rate]}", --reconstruction-weight, "{parameters[reconstruction_weight]}", --response-rank, "{parameters[response_rank]}", --residual-penalty, "{parameters[residual_penalty]}", --max-seconds, "{parameters[max_seconds]}", --sources, "{parameters[sources]}"]
  artifacts: {model: model}
evaluate:
  source: modules/slp-1-1-joint-world-v1
  inputs: [development, reference, model]
  dependencies: requirements-linux.lock
  command: [python3, evaluate.py, --development, "{inputs[development]}", --reference, "{inputs[reference]}", --model, "{inputs[model]}", --checkpoint, "{parameters[checkpoint]}", --output, "{output}", --device, cuda]
  metrics: metrics.json
  artifacts: {report: report.json, predictions: predictions.npz}
metrics:
  k562_mse: {direction: minimize}
  rpe1_mse: {direction: minimize}
  k562_centered_pearson: {direction: maximize}
  rpe1_centered_pearson: {direction: maximize}
  norman_autonomous_mse: {direction: minimize}
  norman_observed_parent_mse: {direction: minimize}
primaryMetric: k562_mse
baseline: expanded
candidates:
  expanded:
    rationale: Train the five-context state model with explicit control context and evaluate held interventions and combinations.
    parameters: {steps: 20000, save_every: 5000, checkpoint: step-020000.safetensors, seed: 731, norman_fold: 0, width: 128, batch_size: 32, observation_queries: 512, decode_queries: 512, learning_rate: 0.0002, reconstruction_weight: 0.05, response_rank: 16, residual_penalty: 1.0, max_seconds: 2700, sources: "k562,rpe1,norman,gwps,hepg2"}
limits: {timeoutSeconds: 3600, cpuSeconds: 3600}
executor: local
