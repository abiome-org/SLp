apiVersion: omf.dev/v1alpha1
kind: WorkloadSpec
metadata:
  name: slp-1-1-pretrain
spec:
  evaluationRefs:
    - evaluationspec/slp-1-1-molecular
  graph:
    stages:
      - name: audit
        module: modules/slp-1-1-corpus-audit/module.yaml
        operation: run
        inputs:
          pretrain: dataset/slp-1-1-pretrain
          molecularValidation: dataset/slp-1-1-molecular-validation
          molecularReward: dataset/slp-1-1-molecular-reward
        config:
          strictInterventionIsolation: true
        outputs:
          - audit
          - auditPassed
          - leakageViolations
          - benchmarkLabelRecords
          - pretrainRecords
          - validationRecords
          - rewardRecords
          - speciesCount
          - auditReport
      - name: train
        needs: [audit]
        module: modules/slp-1-1-world/module.yaml
        operation: run
        inputs:
          pretrain: dataset/slp-1-1-pretrain
          molecularValidation: dataset/slp-1-1-molecular-validation
          molecularReward: dataset/slp-1-1-molecular-reward
          corpusAudit: audit.audit
        config:
          seed: 111
          epochs: 8
          reinforcementEpochs: 2
          batchSize: 32
          learningRate: 0.0003
          reinforcementLearningRate: 0.00002
          reinforcementAnchorWeight: 0.1
          dModel: 512
          nhead: 8
          encoderLayers: 8
          decoderLayers: 4
          ffnMultiplier: 4
          dropout: 0.1
        outputs:
          - modelState
          - checkpointSha256
          - validationNll
          - validationBaselineNll
          - validationNllImprovement
          - validationEffectPearson
          - minimumSpeciesNllImprovement
          - rlRetained
          - parameterCount
          - checkpoint
          - trainingReport
