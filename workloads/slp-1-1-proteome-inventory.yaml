    stages:
      - name: inventory
        module: modules/slp-1-1-proteome-inventory/module.yaml
        operation: run
        inputs:
          rawProteome: omf://abiome/slp/datasetsnapshot/slp-1-1-proteome-raw-v2@sha256:5392d4df7e962c9f59798b83fbdf8e71cd568b30c78a498702d50fabc059397e
