          sgdRetiredQuarantine: artifact:sha256:07ea82f877224496c24effc2aa2a2b684c01b85017e616a70f003a5363f6925f
          sgdMappingManifest: artifact:sha256:c74ea81ce604357b998e5f09130dff85bf8a7a26504b9b2426f8038608c52d9c
