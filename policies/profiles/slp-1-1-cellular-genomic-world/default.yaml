# Promotion policy for experiment-cellular-genomic-world.yaml.
apiVersion: openfoundry.dev/v1alpha1
kind: Policy
metadata:
  name: default
spec:
  rules:
  - name: allow-slp-operator
    effect: allow
    match:
      actor: slp-researcher
      resource: abiome/slp
  - name: deny-unapproved-network
    effect: deny
    match:
      action: network.egress
      purpose: unapproved
  config:
    dirtyWorktree: archive
    promotion:
      requireEvaluationPass: true
      thresholds:
        score_max_error:
          maximum: 1.0e-05
        feature_max_error:
          maximum: 0.0002
