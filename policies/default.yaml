apiVersion: omf.dev/v1alpha1
kind: Policy
metadata:
  name: default
spec:
  rules:
    - name: allow-slp-operator
      effect: allow
      match:
        actor: slp-researcher
        resource: abiome/slp
    - name: deny-unapproved-network
      effect: deny
      match:
        action: network.egress
        purpose: unapproved
  config:
    dirtyWorktree: archive
    promotion:
      requireEvaluationPass: true
