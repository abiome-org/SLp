apiVersion: openfoundry.dev/v1alpha1
kind: EvaluationSpec
metadata:
  name: slp-1-1-molecular-artifact
spec:
  metrics:
    - name: molecular-profile-diagnostic-only
      output: molecular.diagnosticPassed
    - name: molecular-artifact-compatibility
      output: molecular.compatibilityPassed
    - name: strict-corpus-audit
      output: molecular.strictCorpusAuditPassed
    - name: frozen-held-roster-match
      output: molecular.heldRosterValidationMatch
    - name: target-free-query-manifest-match
      output: molecular.exactTargetFreeQueryManifest
    - name: exact-profile-panel-join
      output: molecular.exactProfilePanelJoin
    - name: centering-held-intervention-overlap
      output: molecular.centeringHeldInterventionOverlap
    - name: benchmark-label-records
      output: molecular.benchmarkLabelRecords
    - name: perturbation-specific-pearson
      output: molecular.perturbedCentroidPearson
    - name: worst-species-perturbation-specific-pearson
      output: molecular.minimumSpeciesPerturbedCentroidPearson
    - name: ordinary-pearson-descriptive
      output: molecular.ordinaryPearson
    - name: centroid-accuracy-descriptive
      output: molecular.centroidAccuracyCommonPanel
  extensions:
    benchmarkAccess: forbidden
    selectionClass: molecular-only
    scope: diagnostic-only evaluation of five separate DatasetSnapshots, one target-free prediction artifact, and exact checkpoint bytes
    compatibilityScope: target-free typed predictions exact-joined to evaluator-only held truth with independent admitted audit and roster
    advancementGate: false
    advancementRequires: frozen baseline NLL deltas plus the complete MODEL_CARD rule
    doesNotAuthorize: model release or portable-inference claims
