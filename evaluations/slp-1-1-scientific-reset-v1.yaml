unchangedNumericalFloors:
  note: retain MODEL_CARD floors; this review neither edits historical gates nor makes the yeast pilot sufficient for the program hypothesis
  leakageViolations: 0
  benchmarkLabelRecords: 0
  minimumNllDeltaNatsPerObservedTargetAgainstEachBaseline: 0.02
  minimumRelativeNllImprovementAgainstEachBaseline: 0.02
  minimumTrainingCentroidAdjustedPearson: 0.10
  minimumProtectedSpeciesAndSourceNllDelta: 0.0
  relativeNllCaveat: continuous-density NLL can be zero or negative and changes under rescaling; freeze value space and an explicit denominator convention before any run, never silently substitute MSE
  acceptance: all registered criteria must pass for one frozen candidate; a diagnosticPassed flag cannot authorize advancement

consumerRequirements:
  - Consume the exact two-file corpus bundle and v1.5 signed handoff; reverify signature and composite identities before allocating a model.
  - Join all entities by NCBI taxonomy ID plus stable source ID, including target-free inference.
  - Route only covariates marked world into representation inputs; audit sample locators stay excluded.
  - Carry identical basal-context semantics and allowed covariates through fitting and target-free prediction.
  - Resolve only likelihoods requested by the admitted query; a Gaussian-only corpus must not require an NB ontology entry.
  - Use a new immutable consumer and prediction contract; never modify frozen numerical modules in place.
  - Batch independent query operations with declared floating-point tolerances; test panel, ordering, padding, chunk and batch behavior.
  - Declare device, target budget, record coverage, optimizer steps and wall-time cap explicitly; never inherit the CPU smoke workload as a biological schedule.

modelComparison:
  startingFamily: small residual conditional-mean operator with a fitted mean reference, static action/query features and an explicit basal-state path
  alternatives: [feature-bilinear-ridge, small-set-encoder-query-decoder]
  initialLikelihood: Gaussian in the fixed proteome log2 value space
  sequenceStatistics: weak feature-control arm only; retain for matched comparisons
  richerFeatures: admit an order-sensitive frozen sequence representation separately with exact model revision, source rights, extraction and normalization hashes; no benchmark-derived annotations
  experimentalOrder: first compare architectures at identical features and budget; then compare feature packs at fixed architecture
  combinationBranch: defer until combination molecular outcomes and a held-combination protocol can identify non-additivity
  populationBranch: defer shared stochastic state or other joint generative construction until replicate or cell distributions support the objective
  reinforcement: disabled; likelihood baselines and deterministic continuation precede any reward experiment

evaluationRequirements:
  baselines: [matched-basal-context-only, fitting-perturbation-mean, txpert-additive, feature-bilinear-ridge]
  probabilisticBaselines: freeze scales using only gene-grouped out-of-fold fitting residuals; no held validation or benchmark calibration
  ridgeSelection: preregister fitting-only gene-grouped folds and regularization grid; group all records and compound actions involving an intervention together
  missingness: predict the full preregistered panel, score observed values without zero imputation, report coverage and detection dependence
  weighting: report per-intervention macro metrics as primary plus per-observed-target NLL; never treat readout count as independent biological sample size
  uncertainty: paired resampling at intervention-gene level within source/species; preserve replicate clusters and report every frozen seed
  sourceNormalization: upstream release used plate/global statistics before our split; resolve that dependency or explicitly limit to processed-release retrospective prediction
  sourceNoise: sample-row IDs are not evidence of independent biological replicates; bound/DE metrics require verified replicate structure
  negativeControls: action-feature permutation within fitting strata and mean-only prediction; frozen before protected evaluation
  stageGate: complete source/species baseline-NLL comparison in the evaluator, not the trainer

broaderDataRequirements:
  contextTransfer: rights-admitted molecular interventions across distinct biological contexts with matching unperturbed profiles and whole-context outcome exclusion
  speciesTransfer: independently admitted human molecular source plus within-species held-gene tests and a separately locked transfer test
  combinationTransfer: measured molecular combinations, with all held constituent outcomes excluded for both-gene-cold claims
  temporalDynamics: time-resolved perturbational evidence and an explicit transition objective
  yeastAtlas: existing genotype inventory is identity evidence only; quantitative admission and count/library-size contracts remain separate prerequisites

downstreamBenchmarkDecision:
  historicalSlp1: retrospective only; never becomes a new untouched confirmation set
  primaryFutureEndpoint: context-specific experimentally measured genetic-interaction or viability endpoint with screened negatives and declared population
  unknownPairs: unlabeled, not automatically experimentally negative
  comparisons: label-free application scores separate from fold-local supervised readouts; mean/additive/linear/degree/feature/published methods on identical splits and modalities
  coldStart: both evaluation genes absent from every fitting quantitative trajectory and supervised-readout training edge
  ranking: report AUPRC with prevalence, precision and recall at frozen experimental budgets, and uncertainty; AUROC alone is insufficient
  confirmation: lock candidate, application score, sign, calibration and threshold before independently controlled final or prospective evaluation

unresolvedAuthorizationAndRuntime:
  - Independent custodian public key, signed recipient-bound authorization and separate training/evaluation stores are required.
  - Restoring an audit CLI is not a portable runtime closure or training authorization.
  - Native producer lineage, rights enforcement and inference artifact materialization remain separate OMF release gates.
