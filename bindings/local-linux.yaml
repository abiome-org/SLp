apiVersion: omf.dev/v1alpha1
kind: Binding
metadata:
  name: local-linux
spec:
  executor: local
  resources:
    timeoutSeconds: 3600
    # RLIMIT_NPROC is per Unix user, not per OMF worker. WSL hosts desktop and
    # tool processes under the same uid, so leave bounded headroom for them.
    processes: 512
    fileSizeBytes: 107374182400
